<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出怪帧时间线 · 明日方舟 2.7.71 / 190</title>
<style>
:root{--bg:#12161c;--panel:#1a2029;--line:#2b3542;--text:#dde5ef;--muted:#8b9aab;--accent:#59c2ff;
--spawn:#ffd166;--warn:#ff6b5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
header h1{font-size:15px;margin:0}header .sub{color:var(--muted);font-size:12px}
.gh-link{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px}.gh-link:hover{color:#fff}.gh-link svg{width:16px;height:16px;flex:none}
main{display:grid;grid-template-columns:var(--side-w, 320px) 6px 1fr;height:calc(100vh - 45px)}
main.side-collapsed{--side-w:34px}
main.side-collapsed aside .tools,main.side-collapsed #level-list{display:none}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .tools{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=number],select{background:#0e1319;color:var(--text);border:1px solid var(--line);
border-radius:4px;padding:4px 6px;font:inherit;width:100%}
#level-list{overflow:auto;padding:6px 0}
.row{padding:4px 10px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.row:hover{background:#1e2733}.row.on{background:#243447;box-shadow:inset 2px 0 0 var(--accent)}
.row .code{color:var(--accent);min-width:54px}.row .id{color:#5c6a7a;font-size:11px;margin-left:auto}
.row .badge{color:var(--spawn);font-size:11px}
.chapter{padding:6px 10px 2px;color:#7d8b9b;font-size:11px;letter-spacing:.06em;border-top:1px solid #1d252f}
select{background:#0e1319;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 6px;
font:inherit;width:100%}

.chip{border:1px solid var(--line);border-radius:9px;padding:0 6px;font-size:11px;color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0d1218;font-weight:600}
.empty,.none{color:var(--muted);padding:8px 10px;font-size:12px}
section.right{display:flex;flex-direction:column;min-height:0;min-width:0}
#level-head{padding:10px 14px;border-bottom:1px solid var(--line)}
#level-head .title{font-size:15px}#level-head .path{color:#5c6a7a;font-size:11px;word-break:break-all}
#status{padding:6px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
/* 本地页用 #stale 提示「页面代码比服务端旧，请 Ctrl+F5」；分发版是离线单文件、没有可比的服务端，
   这个元素只保留占位（保持两页 DOM 结构一致，隐藏不会有视觉差异）。 */
#stale{display:none;padding:7px 14px;background:#3a2a1c;color:#ffd166;font-size:12px;
border-bottom:1px solid #5a4028}
/* 用户口径：左侧边栏可拖动调宽、可收起（双击分隔条 / 点按钮切换）。 */
/* 侧栏拖动条是网格的一列；收起要真正腾出空间：网格项默认 min-width:auto，
   只把列宽改小是没用的，必须给 aside 加 min-width:0 + overflow:hidden。
   收起/展开按钮放页头（侧栏收起后按钮仍在，能点回来）。 */
#side-resize{cursor:col-resize;background:linear-gradient(#1d252f,#141a22)}
#side-resize:hover{background:var(--accent)}
/* 侧栏收起/展开用主流做法：右侧一条常驻的竖直轨道放箭头，收起后轨道还在，点箭头即可展开。 */
aside{min-width:0;overflow:hidden;display:flex;flex-direction:row}
.side-inner{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.side-rail{flex:0 0 22px;width:22px;border:0;border-left:1px solid var(--line);background:#12171f;
color:var(--muted);cursor:pointer;padding:0;font:inherit;display:flex;align-items:center;justify-content:center}
.side-rail:hover{background:#1b2430;color:var(--text)}
.side-rail .chev{font-size:13px;line-height:1;transition:transform .15s ease}
main.side-collapsed .side-rail .chev{transform:rotate(180deg)}
main.side-collapsed .side-inner{display:none}
/* 收起时拖动条必须留在网格里（它是第 2 列），否则右侧内容被挤进 6px 那列。 */
main.side-collapsed #side-resize{pointer-events:none;background:#1d252f}
#options{padding:8px 14px;border-bottom:1px solid var(--line)}
/* 用户口径：关卡地图在左，隐藏组 / 分支波次 / 随机刷怪组在右，智能换行（不必同一行）。 */
#options .opt-cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
#options .opt-map{flex:0 1 360px;min-width:280px}
#options .opt-map .grp{width:100%}
#options .opt-groups{flex:1 1 460px;min-width:300px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
#options .opt-groups .grp{flex:0 1 auto;max-width:100%}
#options .grp{border:1px solid var(--line);border-radius:5px;padding:6px 9px;background:#161c25}
#options h4{margin:0 0 4px;font-size:11px;color:var(--muted)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
#summary{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px}
#summary b{color:var(--spawn)}
/* 表格实现规范（用户口径 12）：表头 .tl-head（grid）与事件表 table.ev-table 由 JS 写
   同一组像素列宽 + 同一个总宽度，所以两边列宽逐像素相等；表头左右 margin 20px = 事件表的嵌套
   内缩（wave-box 10+1 + frag-box 8+1）。盒子用 min-width:fit-content 包住比自己宽的表
   （不要 max-content：table-layout:fixed + 它会算出 1e6 px 的表格），窄屏滚到最右能看到最后一列。 */
.tl-head{margin:0 20px}
.wave-box,.frag-box{min-width:fit-content}
#timeline{overflow:auto;padding:0 0 30px;min-height:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:3px 9px;border-bottom:1px solid #1d252f;white-space:nowrap}
thead th{position:sticky;top:0;background:#161c25;color:var(--muted);font-size:11px}
tr.row-spawn td{background:#231f14}tr.row-spawn .kind{color:var(--spawn);font-weight:600}
tr.row-other td{color:var(--muted)}/* 嵌套盒子：波次盒 > fragment 盒 > 事件行（行仍是 <tr data-row>，列宽靠 TL_COLS 对齐） */
.tl-head{position:sticky;top:0;z-index:3;display:grid;background:#161c25;color:var(--muted);
font-weight:600;font-size:11px;border-bottom:1px solid var(--line)}
.tl-head span{padding:3px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wave-box{margin:8px 10px 12px;border:1px solid var(--line);border-radius:7px;background:#141a22;overflow:hidden}
.wave-box.branch-box{border-color:#4a3d2a}
.wave-head{padding:4px 9px;background:#1b2430;color:var(--text);font-size:12px;border-bottom:1px solid var(--line)}
.frag-box{margin:8px;border:1px solid #263140;border-radius:6px;background:#121821;overflow:hidden}
.frag-head{padding:3px 9px;background:#161f2a;color:var(--muted);font-size:11px;border-bottom:1px solid #263140}
table.ev-table{table-layout:fixed}
table.ev-table td{overflow:hidden;text-overflow:ellipsis}
.row-gate{padding:4px 9px;background:#1a2430;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.row-gate .gate-label{color:var(--text)}
.gate-input{width:92px;padding:1px 4px;background:#0e1319;color:var(--text);border:1px solid var(--line);border-radius:4px}
.zero{color:#4d5a68}.tag{border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted);font-size:11px}
.tag.rg{cursor:pointer;color:var(--accent);border-color:#33506a}
.tag.rg:hover{border-color:var(--accent);color:#fff}
.tag.rg.chosen{color:#7ee0a8;border-color:#3f6b52}
td.sp-cell{cursor:help}td.sp-cell b{color:var(--accent);letter-spacing:.06em}
#map-grp{min-width:340px}.map-head{font-size:11px;color:var(--muted);margin-bottom:4px}
/* 用户口径 16：出生点=直径等于格子边长的圆（颜色=敌人哈希色），路径层在圆的下一层，
   格子步距必须正好等于 cell（gap:0，格子分界用 inset 阴影画），否则绝对定位的圆/折线会错格。 */
.spawn-map{position:relative}
.spawn-map .tile-grid{display:grid;gap:0;justify-content:start;position:relative;z-index:0}
.spawn-map i{width:22px;height:22px;display:block;border-radius:3px;background:#2a3340;
box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.spawn-map .path-layer{position:absolute;left:0;top:0;z-index:1;pointer-events:none}
.spawn-map .path-top-layer{z-index:3;display:none}
/* 悬停时敌人自己再上一层（z4 > 路径层 z3）：敌人压在路径上，路径压在别的敌人上。 */
.spawn-map .mark-top-layer{position:absolute;left:0;top:0;z-index:4}
.spawn-map .path-layer polyline{transition:opacity .12s ease}
.spawn-map .mark-layer{position:absolute;left:0;top:0;z-index:2}
.spawn-map .mk-dot{position:absolute;display:flex;align-items:center;justify-content:center;
border-radius:50%;color:#fff;font-weight:700;font-size:11px;cursor:pointer;box-sizing:border-box;
border:1px solid rgba(0,0,0,.35);
text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.7)}
.spawn-map .mk-dot.hot{outline:2px solid #fff;outline-offset:-2px}
.spawn-map .mk-dot.top{z-index:5}
.spawn-map .mk-dot.alt{border-style:dashed}
.spawn-map .mk-dot.preview{border:2px dashed rgba(255,255,255,.85)}
.spawn-map .mk-dot.dim{opacity:.35}
.spawn-map i.c-ground{background:#3a4757}.spawn-map i.c-highland{background:#6b5a34}
.spawn-map i.c-wall{background:#4a4f57}.spawn-map i.c-flyonly{background:#232a33}
.spawn-map i.c-hole{background:#0b0e12}.spawn-map i.c-start{background:#8b3a44}
.spawn-map i.c-end{background:#2f6b91}.spawn-map i.has-mk{outline:1px solid #ff7ad9}
.spawn-map .mk{font-size:11px;font-weight:700;color:#ffe9a8;text-shadow:0 0 3px #000}
.spawn-map .mk.alt{color:#9fd8ff}
.map-legend{margin-top:6px;font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.map-legend i{width:10px;height:10px;display:inline-block;border-radius:2px}
.map-legend i.c-start{background:#8b3a44}.map-legend i.c-end{background:#2f6b91}
tr.pickable{cursor:pointer}tr.pickable:hover td{background:#1f2a36}
tr.sel td{background:#2b3a4d !important}
</style></head>

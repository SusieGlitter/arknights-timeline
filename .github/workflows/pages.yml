# 把仓库根目录直接发布成 GitHub Pages —— 本仓库内容就是出怪时间线的三个文件
# （index.html / spawn-data.js / spawn-waves.js），所以 artifact 的 path 用 '.'。
#
# 一次性设置：仓库 Settings -> Pages -> Build and deployment -> Source 选
# 「GitHub Actions」（只需点一次，之后每次 push 到 main 都会自动发布）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 第一次运行就把 Pages 打开（否则 deploy-pages 会因为站点未启用而失败），
          # 之后这个开关是幂等的。
          enablement: true
      - name: Upload site (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
